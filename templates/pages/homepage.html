{% extends "_base.html" %}

{% block title %}Home{% endblock %}

{% block main %}
<h1 id="to-do-main-header">To-Do Lists</h1>

<form id="add-todo-item-form" method="POST">
  {% csrf_token %}
  <input id="add-todo-textbox" type="text" placeholder="Enter a to-do item" 
     name="add_todo" value="" />
</form>

<table id="todo-tbl">
  <thead id="todo-tbl-head"></thead>
  <tbody id="todo-tbl-body"></tbody>
</table>
{% endblock %}
